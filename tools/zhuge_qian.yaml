identity:
  name: zhuge_qian
  author: kagurazaka135
  label:
    en_US: Zhuge Oracle
    zh_Hans: 诸葛神数
description:
  human:
    en_US: Zhuge divination from three Chinese characters (384 oracles,
      deterministic). For entertainment only.
    zh_Hans: 报三个汉字起诸葛神数（384 签，确定性排盘）。占卜结果仅供娱乐。
  llm: Draw a Zhuge oracle (诸葛神数) from exactly three Chinese characters the
    user reports. Use when the user gives three characters for divination.
    Returns one of 384 oracles with poem and interpretation. For entertainment
    only.
parameters:
  - name: question
    type: string
    required: false
    form: llm
    label:
      en_US: Question
      zh_Hans: 所问之事
    human_description:
      en_US: What the user wants to ask about (used for interpretation).
      zh_Hans: 用户所问之事（用于 AI 解读）。
    llm_description: The question or matter the user wants to divine about.
  - name: model
    type: model-selector
    scope: llm
    required: false
    form: form
    label:
      en_US: Interpretation Model
      zh_Hans: 解读模型
    human_description:
      en_US: LLM used for AI interpretation; leave empty to draw only.
      zh_Hans: 用于 AI 解读的模型；不选则只求签不解读。
    llm_description: Model configuration for AI interpretation.
  - name: interpret
    type: boolean
    required: false
    form: form
    default: true
    label:
      en_US: Enable AI Interpretation
      zh_Hans: 启用 AI 解读
    human_description:
      en_US: Whether to run AI interpretation with the selected model.
      zh_Hans: 是否用所选模型生成 AI 解读。
    llm_description: Whether to run AI interpretation after drawing.
  - name: chars
    type: string
    required: true
    form: llm
    label:
      en_US: Three Chinese Characters
      zh_Hans: 三个汉字
    human_description:
      en_US: Three Chinese characters reported by the user, e.g. 找工作.
      zh_Hans: 用户心中默念问题后报的三个汉字，如「找工作」。
    llm_description: Exactly three Chinese characters (only the first three are
      used). Required.
output_schema:
  type: object
  properties:
    method:
      type: string
      description: Method name.
    summary:
      type: string
      description: Human-readable oracle summary.
    result:
      type: object
      description: Full structured oracle result.
    interpretation:
      type: string
      description: AI interpretation (empty if skipped or failed).
extra:
  python:
    source: tools/zhuge_qian.py
